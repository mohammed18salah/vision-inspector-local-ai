<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForgeSight Windows</title><link rel="stylesheet" href="design-system.css"><style>body{margin:0;background:var(--fs-canvas)}.preview{max-width:1120px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.top h1{margin:0;font:600 28px var(--fs-font-display)}.subtitle{color:var(--fs-text-secondary);font-size:13px}.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.swatch{padding:14px;border:1px solid var(--fs-border);border-radius:var(--fs-radius-md);font:12px var(--fs-font-mono)}.swatch i{display:block;height:38px;margin-bottom:10px;border-radius:7px}.mini{display:grid;grid-template-columns:190px 1fr 250px;gap:12px;padding:12px;margin-top:22px}.nav,.inspector,.stage{padding:16px}.nav h2,.inspector h2{margin:0 0 14px;font:600 16px var(--fs-font-display)}.nav p,.inspector p{color:var(--fs-text-secondary);font-size:12px}.stage{min-height:330px;position:relative;overflow:hidden;background:radial-gradient(circle at 45% 32%,#314963 0,#18202b 38%,#11161d 82%);border-radius:var(--fs-radius-md)}.scan{position:absolute;inset:20% 22%;border:2px solid var(--fs-overlay-box);box-shadow:0 0 0 1px rgba(83,178,255,.35),0 0 32px rgba(83,178,255,.15)}.tag{position:absolute;top:-28px;right:-2px;padding:5px 8px;color:#06121F;border-radius:6px 6px 0 0;background:var(--fs-overlay-box);font:11px var(--fs-font-mono)}.tentative{position:absolute;left:12%;bottom:18%;width:29%;height:20%;border:2px dashed var(--fs-overlay-tentative)}.tentative .tag{color:#201300;background:var(--fs-overlay-tentative)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}@media(max-width:760px){.preview{padding:16px}.mini{grid-template-columns:1fr}.nav{display:none}}</style></head><body><main class="preview fs-shell"><header class="top"><div><h1>ForgeSight Windows</h1><p class="subtitle">نظام تصميم لمساحة فحص محلية عالية الدقة</p></div><span class="fs-status fs-status-local">LOCAL · GPU READY</span></header><section class="swatches"><div class="swatch fs-panel"><i style="background:#101317"></i>Canvas<br>#101317</div><div class="swatch fs-panel"><i style="background:#171B21"></i>Surface<br>#171B21</div><div class="swatch fs-panel"><i style="background:#53B2FF"></i>Azure<br>#53B2FF</div><div class="swatch fs-panel"><i style="background:#A8E85A"></i>Local ready<br>#A8E85A</div><div class="swatch fs-panel"><i style="background:#F4BE63"></i>Tentative<br>#F4BE63</div></section><section class="mini fs-panel"><aside class="nav fs-panel"><h2>المساحة</h2><p>الصور</p><p>الفيديو</p><p style="color:var(--fs-primary)">الفحص الحالي</p></aside><section class="stage"><span class="fs-status fs-status-local">WEBGPU</span><div class="scan"><span class="tag">01 · سيارة · 94%</span></div><div class="tentative"><span class="tag">مرشح · طائر · 38%</span></div></section><aside class="inspector fs-panel"><h2>نتائج حقيقية</h2><p>سيارة <b style="color:var(--fs-accent)">94%</b></p><p>مبنى <b style="color:var(--fs-accent)">65%</b></p><p><span class="fs-status fs-status-tentative">مرشح</span> طائر</p></aside></section><div class="actions"><button class="fs-button fs-button-primary">ابدأ التحليل</button><button class="fs-button fs-button-secondary">اختيار ملف</button><button class="fs-button fs-button-secondary">تصدير JSON</button></div></main></body></html>
