<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ForgeSight Classic Dark</title><link rel="stylesheet" href="design-system.css"><style>html,body{margin:0;overflow-x:clip;background:var(--fs-canvas)}body{padding:var(--fs-space-8);font-family:var(--fs-font-body)}.preview{max-width:1120px;margin:auto}.intro{display:flex;align-items:end;justify-content:space-between;gap:var(--fs-space-4);margin-bottom:var(--fs-space-6)}h1,h2,p{margin:0}h1{font:650 1.875rem/1.25 var(--fs-font-display)}h2{font:600 1rem/1.25 var(--fs-font-display)}.muted{margin-top:var(--fs-space-2);color:var(--fs-text-secondary);font-size:.875rem}.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--fs-space-3);margin-bottom:var(--fs-space-6)}.swatch{padding:var(--fs-space-3);color:var(--fs-text-secondary);font:500 .75rem/1.4 var(--fs-font-mono)}.swatch i{display:block;height:42px;margin-bottom:var(--fs-space-2);border:1px solid var(--fs-border);border-radius:var(--fs-radius-sm)}.mini{display:grid;grid-template-columns:190px minmax(0,1fr) 250px;gap:var(--fs-space-3);padding:var(--fs-space-3)}.nav,.inspect,.stage{padding:var(--fs-space-4)}.nav p,.inspect p{margin-top:var(--fs-space-3);color:var(--fs-text-secondary);font-size:.8125rem}.stage{min-height:330px;position:relative;overflow:hidden;background:var(--fs-canvas);border-radius:var(--fs-radius-md)}.stage:before{content:"";position:absolute;inset:18% 14%;border:1px solid var(--fs-overlay-box);border-radius:var(--fs-radius-sm);box-shadow:0 0 0 1px var(--fs-focus-ring)}.tag{position:absolute;top:18%;right:14%;padding:6px 8px;color:var(--fs-text-primary);background:var(--fs-surface-raised);border:1px solid var(--fs-border);border-radius:var(--fs-radius-sm);font:600 .6875rem/1 var(--fs-font-mono)}.candidate{position:absolute;left:19%;bottom:22%;width:24%;height:18%;border:1px dashed var(--fs-overlay-tentative);border-radius:var(--fs-radius-sm)}.candidate .tag{top:-28px;right:auto;left:0;color:var(--fs-warning)}.actions{display:flex;gap:var(--fs-space-2);flex-wrap:wrap;margin-top:var(--fs-space-5)}@media(max-width:768px){body{padding:var(--fs-space-4)}.intro{align-items:start;flex-direction:column}.swatches{grid-template-columns:repeat(2,minmax(0,1fr)}.mini{grid-template-columns:minmax(0,1fr)}.nav{display:none}}</style></head><body><main class="preview fs-shell"><header class="intro"><div><h1>ForgeSight Classic Dark</h1><p class="muted">نظام هادئ لمساحة فحص محلية دقيقة على Windows</p></div><span class="fs-status fs-status-local">تحليل محلي</span></header><section class="swatches"><div class="swatch fs-panel"><i style="background:var(--fs-canvas)"></i>Canvas</div><div class="swatch fs-panel"><i style="background:var(--fs-surface)"></i>Surface</div><div class="swatch fs-panel"><i style="background:var(--fs-primary)"></i>Focus blue</div><div class="swatch fs-panel"><i style="background:var(--fs-warning)"></i>Candidate amber</div></section><section class="mini fs-panel"><aside class="nav fs-panel"><h2>المساحة</h2><p>تحليل صورة</p><p>تحليل فيديو</p><p>السجل المحلي</p></aside><section class="stage"><span class="tag">01 · سيارة · 94%</span><div class="candidate"><span class="tag">مرشح · طائر · 38%</span></div></section><aside class="inspect fs-panel"><h2>النتائج</h2><p>سيارة <b>94%</b></p><p>مبنى <b>65%</b></p><p><span class="fs-status fs-status-tentative">مرشح</span> طائر</p></aside></section><div class="actions"><button class="fs-button fs-button-primary">ابدأ التحليل</button><button class="fs-button fs-button-secondary">اختيار ملف</button><button class="fs-button fs-button-quiet">السجل المحلي</button></div></main></body></html>
