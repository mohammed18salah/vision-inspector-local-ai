name: Windows desktop release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release (for example v1.1.0). Leave empty for artifact-only build."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      HAS_WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 != '' && 'true' || 'false' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test web and desktop core
        run: pnpm test

      - name: Type-check web and desktop
        run: |
          pnpm check
          pnpm desktop:check

      - name: Prepare Authenticode certificate when configured
        if: env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "vision-inspector-signing.pfx"
          [System.IO.File]::WriteAllBytes($certificatePath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          "CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows x64 installer
        run: pnpm desktop:pack:win

      - name: Verify Authenticode signature
        if: env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found on the Windows runner." }
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            & $signTool.FullName verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode validation failed for $($_.Name)." }
          }

      - name: Record unsigned build state
        if: env.HAS_WINDOWS_SIGNING_CERTIFICATE != 'true'
        shell: pwsh
        run: Write-Host "No Authenticode certificate is configured; this release is intentionally unsigned."

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Out-File -Encoding ascii release\SHA256SUMS.txt

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: vision-inspector-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Remove temporary Authenticode certificate
        if: always() && env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP "vision-inspector-signing.pfx") -Force -ErrorAction SilentlyContinue

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $assets = @("release\*.exe", "release\SHA256SUMS.txt")
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:TAG $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Vision Inspector Local AI $env:TAG" --notes-file docs\releases\windows-desktop.md
          }
