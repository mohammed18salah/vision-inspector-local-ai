name: Windows desktop release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release (for example v1.1.0). Leave empty for artifact-only build."
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test web and desktop core
        run: pnpm test

      - name: Type-check web and desktop
        run: |
          pnpm check
          pnpm desktop:check

      - name: Build Windows x64 installer
        run: pnpm desktop:pack:win

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } | Out-File -Encoding ascii release\SHA256SUMS.txt

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: vision-inspector-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $assets = @("release\*.exe", "release\SHA256SUMS.txt")
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:TAG $assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Vision Inspector Local AI $env:TAG" --notes-file docs\releases\windows-desktop.md
          }
